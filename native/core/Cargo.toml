[package]
name = "school-core"
version = "0.6.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "charset", "cookies"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
sha2 = "0.10"
scraper = "0.24"
regex = "1"
httpdate = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
